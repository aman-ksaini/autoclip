[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "0.1.0"
description = "Long video -> AI-picked 30s vertical clips with captions -> YouTube Shorts"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.0",
  "opencv-python-headless>=4.8,<5",
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools]
packages = ["autoclip"]
